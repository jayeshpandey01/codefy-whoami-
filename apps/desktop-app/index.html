<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Codefy</title>
    <style>
      /* First paint, before the stylesheet and ThemeContext load: follow the
         OS appearance so there is no flash of the wrong background. */
      html, body, #root {
        background-color: #ffffff;
        color: #1d1d1f;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        html, body, #root {
          background-color: #1c1c1e;
          color: #f5f5f7;
        }
      }
      /* Window chrome is not selectable; content opts back in where people
         need to copy (code, findings, chat answers). */
      body {
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
